name: Mahesh CI Workflow

on:
  push:

jobs:
  build-and-push: # job ka naam
    runs-on: ubuntu-latest # Github Runner (Free)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # clone the code into a ubuntu runner 

      - name: Setup Docker  
        uses: docker/setup-buildx-action@v4

      - name: Setup Docker  
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub # to authenticate
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_TOKEN }}/skillpulse-backend:mahesh

